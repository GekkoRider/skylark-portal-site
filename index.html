<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Portal — Skylark Learning Club</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z' fill='none' stroke='%23336E8E' stroke-width='1.5' stroke-linejoin='round'/%3E%3Ccircle cx='17.5' cy='7' r='1' fill='%23336E8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#FBF9F3; --ink:#232830; --ink-soft:#556072; --sky:#33668E; --sky-strong:#285376;
    --hairline:#E4DECF; --surface:#FFFFFF; --moss:#4C7A5A;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#141A20; --ink:#E8ECF0; --ink-soft:#9DA9B7; --sky:#79ABD6; --sky-strong:#9BC3E6; --hairline:#2C3742; --surface:#1B232C; --moss:#7FAE8B; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
    background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
    line-height:1.6;
  }
  .card{
    max-width:26rem; width:100%; background:var(--surface); border:1px solid var(--hairline);
    border-radius:16px; padding:2.5rem;
  }
  .brand{ display:flex; align-items:center; gap:0.6rem; font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.1rem; margin-bottom:1.8rem; }
  .brand svg{ width:24px; height:24px; color:var(--sky); flex:none; }
  h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.5rem; line-height:1.2; margin:0 0 0.5rem; }
  p.lede{ color:var(--ink-soft); margin:0 0 1.6rem; font-size:0.95rem; }
  label{ display:block; font-size:0.82rem; font-weight:600; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:0.4rem; }
  input[type="email"]{
    width:100%; font-family:inherit; font-size:0.98rem; color:var(--ink);
    background:var(--paper); border:1px solid var(--hairline); border-radius:9px;
    padding:0.7rem 0.8rem; margin-bottom:1rem;
  }
  input[type="email"]:focus{ outline:2px solid var(--sky); outline-offset:1px; border-color:transparent; }
  button{
    width:100%; font-family:inherit; font-size:0.95rem; font-weight:600;
    background:var(--sky); color:#fff; border:none; border-radius:9px;
    padding:0.8rem; cursor:pointer;
  }
  button:hover{ background:var(--sky-strong); }
  button:disabled{ opacity:0.6; cursor:default; }
  .status{ margin-top:1rem; font-size:0.9rem; }
  .status.success{ color:var(--moss); }
  .status.error{ color:#b34242; }
  .fine{ margin-top:1.6rem; font-size:0.82rem; color:var(--ink-soft); text-align:center; }
  .fine a{ color:var(--sky); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="17.5" cy="7" r="1" fill="currentColor"/></svg>
      Skylark Learning Club
    </div>
    <h1>Parent Portal</h1>
    <p class="lede">Enter the email you used to join — we'll send you a secure sign-in link, no password needed.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
      <button type="submit" id="submitBtn">Send me a sign-in link</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <p class="fine">Trouble signing in? Email <a href="mailto:hello@skylark.education">hello@skylark.education</a>.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ---- Fill these in from your Supabase project settings (API section) ----
    const SUPABASE_URL = 'https://clsbenbapgvgmubzbgxw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsc2JlbmJhcGd2Z211YnpiZ3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTcyNDIsImV4cCI6MjEwMzgzMzI0Mn0.ZcNy6eBKnu8S4Zgxincdm2PgUTezs4Z7NiddWm6JssM';
    // The anon key is safe to expose in client-side code — it's a public key
    // by design, and all data access is enforced by Row Level Security (see schema.sql).
    // ---------------------------------------------------------------------

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already signed in, skip straight to the dashboard.
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace('/dashboard.html');
    });

    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'status';

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
      });

      if (error) {
        statusEl.textContent = "Something went wrong — please try again or email hello@skylark.education.";
        statusEl.className = 'status error';
      } else {
        statusEl.textContent = "Check your inbox! We've sent a sign-in link to " + email + ".";
        statusEl.className = 'status success';
        form.reset();
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send me a sign-in link';
    });
  </script>
</body>
</html>
