<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Portal — Skylark Learning Club</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z' fill='none' stroke='%23336E8E' stroke-width='1.5' stroke-linejoin='round'/%3E%3Ccircle cx='17.5' cy='7' r='1' fill='%23336E8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FBF9F3; --ink:#232830; --ink-soft:#556072; --sky:#33668E; --sky-strong:#285376;
    --hairline:#E4DECF; --surface:#FFFFFF; --surface-tint:#EDF2F5; --wheat:#E0A33E; --moss:#4C7A5A;
    --danger:#B23B3B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#141A20; --ink:#E8ECF0; --ink-soft:#9DA9B7; --sky:#79ABD6; --sky-strong:#9BC3E6;
      --hairline:#2C3742; --surface:#1B232C; --surface-tint:#202B35; --wheat:#EDB65A; --moss:#7FAE8B; --danger:#E08080; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif; line-height:1.6;
  }
  header{
    position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--hairline);
  }
  .header-inner{ max-width:56rem; margin-inline:auto; padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:0.5rem; font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.05rem; }
  .brand svg{ width:22px; height:22px; color:var(--sky); flex:none; }
  #signOutBtn{
    font-family:inherit; font-size:0.85rem; font-weight:600; color:var(--ink-soft);
    background:transparent; border:1px solid var(--hairline); border-radius:8px; padding:0.5rem 0.9rem; cursor:pointer;
  }
  #signOutBtn:hover{ color:var(--ink); background:var(--surface-tint); }
  main{ max-width:56rem; margin-inline:auto; padding:2.5rem 1.5rem 5rem; }
  h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.8rem; margin:0 0 0.3rem; }
  .welcome-sub{ color:var(--ink-soft); margin-bottom:2.5rem; }
  .child-card{
    background:var(--surface); border:1px solid var(--hairline); border-radius:16px;
    padding:1.8rem; margin-bottom:1.6rem;
  }
  .child-name{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.3rem; margin-bottom:0.2rem; }
  .child-meta{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:1.4rem; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.2rem; }
  @media (max-width:600px){ .grid2{ grid-template-columns:1fr; } }
  .field{ background:var(--surface-tint); border-radius:10px; padding:0.9rem 1rem; }
  .field .label{ font-size:0.72rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:0.3rem; }
  .field .value{ font-size:0.98rem; }
  .btn{
    display:inline-flex; align-items:center; gap:0.5rem; font-weight:600; font-size:0.92rem;
    background:var(--sky); color:#fff; text-decoration:none; border-radius:9px; padding:0.65rem 1.1rem;
  }
  .btn:hover{ background:var(--sky-strong); }
  .add-subject{ margin-top:1rem; padding-top:0.8rem; border-top:1px dashed var(--hairline); }
  .add-subject label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:0.4rem; }
  .add-subject-row{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .add-subject-row select{ font-family:inherit; font-size:0.85rem; padding:0.45rem 0.55rem; border-radius:8px; border:1px solid var(--hairline); background:var(--surface-tint); color:var(--ink); flex:1; min-width:8rem; }
  .section-title{ font-size:0.78rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin:1.4rem 0 0.6rem; }
  .pack-row, .report-row{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:0.8rem 0; border-top:1px solid var(--hairline);
  }
  .pack-row .month, .report-row .month{ font-weight:600; font-size:0.92rem; }
  .report-row .text{ color:var(--ink-soft); font-size:0.9rem; margin-top:0.2rem; }
  .empty{ color:var(--ink-soft); font-size:0.9rem; padding:0.6rem 0; }
  #loading, #errorState{ text-align:center; color:var(--ink-soft); padding:4rem 1rem; }

  .consent-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
    padding:1rem 0; border-top:1px solid var(--hairline);
  }
  .consent-main{ flex:1; min-width:0; }
  .toggle{ position:relative; display:flex; align-items:center; gap:0.6rem; cursor:pointer; font-weight:600; font-size:0.95rem; }
  .toggle input{ position:absolute; opacity:0; width:1px; height:1px; }
  .toggle-track{
    flex:none; width:2.6rem; height:1.5rem; border-radius:99px; background:var(--hairline);
    position:relative; transition:background 0.15s ease;
  }
  .toggle-track::after{
    content:""; position:absolute; top:2px; left:2px; width:1.1rem; height:1.1rem; border-radius:50%;
    background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,0.25); transition:transform 0.15s ease;
  }
  .toggle input:checked + .toggle-track{ background:var(--sky); }
  .toggle input:checked + .toggle-track::after{ transform:translateX(1.1rem); }
  .toggle input:focus-visible + .toggle-track{ outline:2px solid var(--sky); outline-offset:2px; }
  .toggle input:disabled + .toggle-track{ opacity:0.5; }
  .consent-note{ color:var(--ink-soft); font-size:0.85rem; margin:0.35rem 0 0; }
  .consent-msg{ font-size:0.82rem; margin:0.4rem 0 0; min-height:1.1em; }
  .consent-msg.ok{ color:var(--moss); }
  .consent-msg.error{ color:var(--danger); }
  .consent-status{ flex:none; font-size:0.82rem; font-weight:600; color:var(--ink-soft); text-align:right; white-space:nowrap; padding-top:0.2rem; }
  .consents-load-error{ color:var(--danger); font-size:0.9rem; padding:0.6rem 0; }
  @media (max-width:600px){
    .consent-row{ flex-direction:column; gap:0.4rem; }
    .consent-status{ text-align:left; }
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="17.5" cy="7" r="1" fill="currentColor"/></svg>
        Skylark Learning Club
      </div>
      <button id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <div id="loading">Loading your dashboard…</div>
    <div id="errorState" style="display:none"></div>
    <div id="content" style="display:none">
      <h1 id="welcomeHeading">Welcome back</h1>
      <p class="welcome-sub">Here's what's coming up for your family.</p>
      <div id="childrenContainer"></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ---- Same values as index.html ----
    const SUPABASE_URL = 'https://clsbenbapgvgmubzbgxw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsc2JlbmJhcGd2Z211YnpiZ3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTcyNDIsImV4cCI6MjEwMzgzMzI0Mn0.ZcNy6eBKnu8S4Zgxincdm2PgUTezs4Z7NiddWm6JssM';
    // ------------------------------------

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('errorState');
    const contentEl = document.getElementById('content');

    function monthLabel(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function dayLabel(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Consent toggles shown in each child card. The child_consents table is
    // append-only — a flip is a new INSERT, never an update — and both consents
    // start off until the parent actively opts in (Membership Agreement 10.3/10.4).
    const CONSENT_TYPES = [
      {
        type: 'session_recording',
        label: 'Allow session recording',
        note: 'Sessions are recorded only for teaching quality and safeguarding. Recordings are never used for marketing.',
      },
      {
        type: 'marketing_use',
        label: 'Allow use in marketing',
        note: "Covers photos, video clips, testimonials, or your child's work in Skylark's marketing. You can withdraw this at any time, with no effect on your child's place in a cohort.",
      },
    ];

    function consentStatusText(granted, dateStr) {
      if (granted) return dateStr ? 'On since ' + dayLabel(dateStr) : 'On';
      return dateStr ? 'Off since ' + dayLabel(dateStr) : 'Off';
    }

    function consentsSectionHtml(childId, currentByType, loadFailed) {
      if (loadFailed) {
        return '<div class="section-title">Consent &amp; permissions</div>' +
          '<p class="consents-load-error">We couldn’t load these settings just now — please refresh to try again.</p>';
      }
      const rows = CONSENT_TYPES.map(c => {
        const cur = currentByType[c.type];
        const granted = !!(cur && cur.granted);
        const noteId = 'consentNote-' + c.type + '-' + childId;
        return `
          <div class="consent-row" data-type="${c.type}">
            <div class="consent-main">
              <label class="toggle">
                <input type="checkbox" class="consentToggle" data-type="${c.type}" aria-describedby="${noteId}"${granted ? ' checked' : ''}>
                <span class="toggle-track" aria-hidden="true"></span>
                <span>${escapeHtml(c.label)}</span>
              </label>
              <p class="consent-note" id="${noteId}">${escapeHtml(c.note)}</p>
              <p class="consent-msg" role="status" aria-live="polite"></p>
            </div>
            <div class="consent-status">${escapeHtml(consentStatusText(granted, cur && cur.created_at))}</div>
          </div>`;
      }).join('');
      return '<div class="section-title">Consent &amp; permissions</div>' +
        `<div class="consents" data-child="${childId}">${rows}</div>`;
    }

    async function handleConsentChange(childId, userId, input) {
      const type = input.dataset.type;
      const row = input.closest('.consent-row');
      const statusEl = row.querySelector('.consent-status');
      const msgEl = row.querySelector('.consent-msg');
      const desired = input.checked;

      input.disabled = true;
      msgEl.className = 'consent-msg';
      msgEl.textContent = 'Saving…';

      const { data, error } = await supabase
        .from('child_consents')
        .insert({ child_id: childId, consent_type: type, granted: desired, method: 'portal', changed_by: userId })
        .select('granted, created_at')
        .single();

      input.disabled = false;

      if (error || !data) {
        input.checked = !desired; // the write didn't land — don't let the toggle lie
        msgEl.className = 'consent-msg error';
        msgEl.textContent = "That didn't save — please try again.";
        console.error('consent insert failed', error);
        return;
      }

      statusEl.textContent = consentStatusText(data.granted, data.created_at);
      msgEl.className = 'consent-msg ok';
      msgEl.textContent = desired ? 'Saved — this is now allowed.' : 'Saved — this is now turned off.';
      setTimeout(() => {
        if (msgEl.textContent.startsWith('Saved')) { msgEl.textContent = ''; msgEl.className = 'consent-msg'; }
      }, 4000);
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.replace('/index.html');
        return;
      }

      document.getElementById('signOutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.replace('/index.html');
      });

      try {
        const { data: family, error: familyErr } = await supabase
          .from('families')
          .select('id, parent_name')
          .eq('auth_user_id', session.user.id)
          .single();
        if (familyErr) throw familyErr;

        document.getElementById('welcomeHeading').textContent =
          'Welcome back, ' + (family.parent_name || 'there') + '!';

        const { data: children, error: childrenErr } = await supabase
          .from('children')
          .select('id, first_name, year_group')
          .eq('family_id', family.id);
        if (childrenErr) throw childrenErr;

        const container = document.getElementById('childrenContainer');

        if (!children || children.length === 0) {
          container.innerHTML = '<p class="empty">No children are linked to your account yet — email hello@skylark.education if this looks wrong.</p>';
        } else {
          for (const child of children) {
            const { data: enrollments } = await supabase
              .from("enrollments")
              .select("cohort_id, cohorts ( strand, day_of_week, session_time, tutor_name, classroom_link )")
              .eq("child_id", child.id)
              .eq("active", true);

            const activeEnrollments = enrollments || [];
            const cohortIds = activeEnrollments.map(e => e.cohort_id).filter(Boolean);

            let packsHtml = `
              <div class="pack-row">
                <span class="month">Getting Started</span>
                <a class="btn" href="/welcome-pack" target="_blank" rel="noopener">View welcome pack</a>
              </div>`;
            if (cohortIds.length) {
              const { data: packs } = await supabase
                .from("packs")
                .select("month, pack_url, cohorts ( strand )")
                .in("cohort_id", cohortIds)
                .order("month", { ascending: false })
                .limit(5);
              if (packs && packs.length) {
                packsHtml += packs.map(p => {
                  const stravLabel = p.cohorts ? (" \u00b7 " + escapeHtml(p.cohorts.strand)) : "";
                  return `
                  <div class="pack-row">
                    <span class="month">${escapeHtml(monthLabel(p.month))}${stravLabel}</span>
                    <a class="btn" href="${escapeHtml(p.pack_url)}" target="_blank" rel="noopener">Download pack</a>
                  </div>`;
                }).join("");
              }
            }

            const { data: reports } = await supabase
              .from("progress_reports")
              .select("month, report_text")
              .eq("child_id", child.id)
              .order("month", { ascending: false })
              .limit(3);

            let reportsHtml = "<p class=\"empty\">No progress reports yet.</p>";
            if (reports && reports.length) {
              reportsHtml = reports.map(r => `
                <div class="report-row" style="display:block">
                  <span class="month">${escapeHtml(monthLabel(r.month))}</span>
                  <div class="text">${escapeHtml(r.report_text)}</div>
                </div>`).join("");
            }

            const consentCurrent = {};
            let consentLoadFailed = false;
            const { data: consentRows, error: consentErr } = await supabase
              .from("child_consents_current")
              .select("consent_type, granted, created_at")
              .eq("child_id", child.id);
            if (consentErr) {
              consentLoadFailed = true;
              console.error("consent load failed", consentErr);
            } else {
              for (const r of (consentRows || [])) consentCurrent[r.consent_type] = r;
            }

            const cohortBlock = activeEnrollments.length
              ? activeEnrollments.map(e => {
                  const cohort = e.cohorts;
                  if (!cohort) return "";
                  return `
                    <div class="grid2">
                      <div class="field"><div class="label">Strand</div><div class="value">${escapeHtml(cohort.strand)}</div></div>
                      <div class="field"><div class="label">Weekly session</div><div class="value">${escapeHtml(cohort.day_of_week)}, ${escapeHtml(cohort.session_time)}</div></div>
                      <div class="field"><div class="label">Tutor</div><div class="value">${escapeHtml(cohort.tutor_name)}</div></div>
                      <div class="field"><div class="label">Year group</div><div class="value">${escapeHtml(child.year_group)}</div></div>
                    </div>
                    <a class="btn" href="${escapeHtml(cohort.classroom_link)}" target="_blank" rel="noopener">Join ${escapeHtml(cohort.strand)} session</a>
                  `;
                }).join("<div style=\"height:0.8rem\"></div>")
              : "<p class=\"empty\">Cohort details are on their way \u2014 we will email you within one working day.</p>";

            const STRANDS = ["English", "Maths", "Science", "Creative Writing", "11+ Preparation"];
            function strandSlug(s) {
              return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
            }
            const enrolledStrands = activeEnrollments.map(e => e.cohorts && e.cohorts.strand).filter(Boolean);
            const availableStrands = STRANDS.filter(s => !enrolledStrands.includes(s));
            const addSubjectHtml = availableStrands.length ? `
              <div class="add-subject">
                <label for="addSubject-${child.id}">Add another subject</label>
                <div class="add-subject-row">
                  <select id="addSubject-${child.id}" class="addSubjectSelect">
                    <option value="">Choose a subject\u2026</option>
                    ${availableStrands.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("")}
                  </select>
                  <button class="btn addSubjectBtn" type="button">Continue to payment \u2014 &pound;99/month</button>
                </div>
              </div>` : "";

            const card = document.createElement("div");
            card.className = "child-card";
            card.innerHTML = `
              <div class="child-name">${escapeHtml(child.first_name)}</div>
              <div class="child-meta">Year ${escapeHtml(child.year_group)}</div>
              ${cohortBlock}
              ${addSubjectHtml}
              <div class="section-title">Digital packs</div>
              ${packsHtml}
              <div class="section-title">Progress reports</div>
              ${reportsHtml}
              ${consentsSectionHtml(child.id, consentCurrent, consentLoadFailed)}
            `;

            card.querySelectorAll(".consentToggle").forEach(input => {
              input.addEventListener("change", () => handleConsentChange(child.id, session.user.id, input));
            });

            const addBtn = card.querySelector(".addSubjectBtn");
            if (addBtn) {
              addBtn.addEventListener("click", () => {
                const select = card.querySelector(".addSubjectSelect");
                const strand = select.value;
                if (!strand) { select.focus(); return; }
                const ref = "child:" + child.id + ":" + strandSlug(strand);
                const url = new URL("https://buy.stripe.com/dRm4gs9Lm3hF5iadp77kc00");
                url.searchParams.set("client_reference_id", ref);
                if (session.user.email) { url.searchParams.set("prefilled_email", session.user.email); }
                window.open(url.toString(), "_blank");
              });
            }
            container.appendChild(card);
          }
        }

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
      } catch (err) {
        console.error(err);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = "We couldn't load your dashboard. Please refresh, or email hello@skylark.education if this keeps happening.";
      }
    }

    init();
  </script>
</body>
</html>
