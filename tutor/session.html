<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live session — Skylark Tutor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z' fill='none' stroke='%23336E8E' stroke-width='1.5' stroke-linejoin='round'/%3E%3Ccircle cx='17.5' cy='7' r='1' fill='%23336E8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FBF9F3; --ink:#232830; --ink-soft:#556072; --sky:#33668E; --sky-strong:#285376;
    --hairline:#E4DECF; --surface:#FFFFFF; --surface-tint:#EDF2F5; --moss:#4C7A5A; --wheat:#B87E22;
    --danger:#B23B3B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#141A20; --ink:#E8ECF0; --ink-soft:#9DA9B7; --sky:#79ABD6; --sky-strong:#9BC3E6;
      --hairline:#2C3742; --surface:#1B232C; --surface-tint:#202B35; --moss:#7FAE8B; --wheat:#E0B36A; --danger:#E08080; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif; line-height:1.5;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:0.7rem 1.1rem; border-bottom:1px solid var(--hairline); flex:none;
  }
  .brand{ display:flex; align-items:center; gap:0.5rem; font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.05rem; }
  .brand svg{ width:20px; height:20px; color:var(--sky); }
  a.back{ color:var(--ink-soft); text-decoration:none; font-weight:600; font-size:0.85rem; }
  a.back:hover{ color:var(--ink); }
  .hostbar{
    display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;
    padding:0.55rem 1.1rem; border-bottom:1px solid var(--hairline); background:var(--surface-tint); flex:none;
  }
  .hostbar.hidden{ display:none; }
  .hostbar button{
    font-family:inherit; font-size:0.8rem; font-weight:600; border-radius:8px; border:1px solid var(--hairline);
    background:var(--surface); color:var(--ink); padding:0.4rem 0.75rem; cursor:pointer;
  }
  .hostbar button:hover{ border-color:var(--sky); }
  .hostbar button.on{ background:var(--sky); color:#fff; border-color:var(--sky); }
  .hostbar .hint{ font-size:0.78rem; color:var(--ink-soft); margin-left:0.15rem; }
  main{ flex:1 1 auto; position:relative; min-height:0; }
  #meetingSDKElement{ position:absolute; inset:0; }
  .panel{
    max-width:30rem; margin:3.5rem auto; padding:0 1.5rem; text-align:center;
  }
  .panel h1{ font-family:"Fraunces",Georgia,serif; font-size:1.35rem; margin:0 0 0.5rem; }
  .panel p{ color:var(--ink-soft); margin:0 0 1.2rem; }
  .panel button, .panel a.btn{
    font-family:inherit; font-size:0.92rem; font-weight:600; border-radius:9px; border:1px solid var(--sky);
    background:var(--sky); color:#fff; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .panel button:disabled{ opacity:0.6; cursor:default; }
  .panel .muted{ font-size:0.85rem; }
  .panel.error h1{ color:var(--danger); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 15c4 0 6-2 8.5-5C13 7 15 5 19 5c0 0-1 3-3.5 4.5C13.5 11 12 12 12 12s4 .5 6-1c0 0-.5 3.5-4 5-2.6 1.1-6 .8-8 1l-4-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="17.5" cy="7" r="1" fill="currentColor"/></svg>
    Skylark Tutor
  </div>
  <a class="back" href="./">← Back to my groups</a>
</header>

<div id="hostbar" class="hostbar hidden">
  <strong style="font-size:0.8rem;">Host tools:</strong>
  <button id="muteAllBtn" type="button">Mute everyone</button>
  <button id="lockBtn" type="button">Lock room</button>
  <button id="admitAllBtn" type="button">Admit waiting</button>
  <span class="hint">For one pupil — mute, rename or remove — use the Participants panel in the toolbar below.</span>
</div>

<main>
  <div id="meetingSDKElement"></div>
  <div id="panel" class="panel">
    <h1 id="panelTitle">Getting your room ready…</h1>
    <p id="panelText">One moment.</p>
    <button id="panelBtn" type="button" style="display:none"></button>
  </div>
</main>

<!-- Zoom Meeting SDK (component view) — vendor globals must load before the SDK bundle -->
<script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/zoom-meeting-embedded-6.2.0.min.js"></script>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://clsbenbapgvgmubzbgxw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsc2JlbmJhcGd2Z211YnpiZ3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTcyNDIsImV4cCI6MjEwMzgzMzI0Mn0.ZcNy6eBKnu8S4Zgxincdm2PgUTezs4Z7NiddWm6JssM';
  const ZOOM_SDK_VERSION = '6.2.0';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panelTitle');
  const panelText = document.getElementById('panelText');
  const panelBtn = document.getElementById('panelBtn');
  const hostbar = document.getElementById('hostbar');
  const sdkEl = document.getElementById('meetingSDKElement');

  const cohortId = new URLSearchParams(location.search).get('cohort');

  function showPanel(title, text, { error = false, button = null } = {}) {
    panel.style.display = 'block';
    sdkEl.style.display = 'none';
    panel.classList.toggle('error', error);
    panelTitle.textContent = title;
    panelText.textContent = text;
    if (button) {
      panelBtn.style.display = 'inline-block';
      panelBtn.textContent = button.label;
      panelBtn.disabled = false;
      panelBtn.onclick = button.onClick;
    } else {
      panelBtn.style.display = 'none';
    }
  }
  function showMeeting() {
    panel.style.display = 'none';
    sdkEl.style.display = 'block';
  }

  async function getSignature() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.replace('./'); return null; }

    const res = await fetch(`${SUPABASE_URL}/functions/v1/zoom-signature`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ cohort_id: cohortId, role: 'host' }),
    });
    const body = await res.json().catch(() => ({}));

    if (res.status === 403) { showPanel('Not your group', "This session isn't assigned to your tutor account. If that's wrong, email hello@skylark.education.", { error: true }); return null; }
    if (res.status === 409 && body.error === 'tutor_zoom_user_missing') {
      showPanel('Zoom not set up yet', 'Your Zoom user needs to be added in the admin portal before you can open this room. Ask the Skylark team to set it, then try again.', { error: true });
      return null;
    }
    if (!res.ok || body.status !== 'ok') {
      showPanel('Couldn’t open the room', 'Something went wrong getting this session ready. Try again in a moment, or email hello@skylark.education.', {
        error: true, button: { label: 'Try again', onClick: () => location.reload() },
      });
      return null;
    }
    return body;
  }

  let client = null;

  async function start() {
    if (!cohortId) { showPanel('Missing session', 'This link is missing its cohort. Go back and open the session from your groups list.', { error: true }); return; }

    const sig = await getSignature();
    if (!sig) return;

    showPanel('Joining as host…', 'Connecting you to the Zoom room.');

    if (typeof ZoomMtgEmbedded === 'undefined') {
      showPanel('Couldn’t load Zoom', 'The Zoom library didn’t load — check your connection or any content blockers, then try again.', {
        error: true, button: { label: 'Try again', onClick: () => location.reload() },
      });
      return;
    }

    client = ZoomMtgEmbedded.createClient();
    try {
      await client.init({
        zoomAppRoot: sdkEl,
        language: 'en-US',
        patchJsMedia: true,
        assetPath: `https://source.zoom.us/${ZOOM_SDK_VERSION}/lib/av`,
      });
      await client.join({
        signature: sig.signature,
        meetingNumber: sig.meetingNumber,
        password: sig.password,
        userName: sig.userName,
        zak: sig.zak,
      });
    } catch (e) {
      console.error('zoom join failed', e);
      showPanel('Couldn’t join the room', (e && (e.reason || e.message)) ? String(e.reason || e.message) : 'Zoom refused the connection. Try again, or email hello@skylark.education.', {
        error: true, button: { label: 'Try again', onClick: () => location.reload() },
      });
      return;
    }

    showMeeting();
    wireHostTools();

    client.on('connection-change', (p) => {
      if (p && (p.state === 'Closed' || p.state === 'Fail')) {
        hostbar.classList.add('hidden');
        showPanel('Session ended', 'You’ve left the room. You can rejoin, or head back to your groups.', {
          button: { label: 'Rejoin', onClick: () => location.reload() },
        });
      }
    });
  }

  function wireHostTools() {
    hostbar.classList.remove('hidden');
    const muteAllBtn = document.getElementById('muteAllBtn');
    const lockBtn = document.getElementById('lockBtn');
    const admitAllBtn = document.getElementById('admitAllBtn');
    let locked = false;

    muteAllBtn.onclick = async () => {
      try { await client.muteAll(true); muteAllBtn.textContent = 'Muted ✓'; setTimeout(() => muteAllBtn.textContent = 'Mute everyone', 2500); }
      catch (e) { console.error(e); }
    };
    lockBtn.onclick = async () => {
      try { locked = !locked; await client.lockMeeting(locked); lockBtn.classList.toggle('on', locked); lockBtn.textContent = locked ? 'Room locked' : 'Lock room'; }
      catch (e) { console.error(e); locked = !locked; }
    };
    admitAllBtn.onclick = async () => {
      try { await client.admitAll(); admitAllBtn.textContent = 'Admitted ✓'; setTimeout(() => admitAllBtn.textContent = 'Admit waiting', 2500); }
      catch (e) { console.error(e); }
    };
  }

  start();
</script>
</body>
</html>
